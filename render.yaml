services:
  - type: web
    name: igxytdl
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ALLOWED_USERS
        sync: false
      - key: COOKIES_FILE
        value: /etc/secrets/cookies.txt
